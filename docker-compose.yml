services:
  # -------------------------------------------------------------
  # 1. POSTGRESQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aiia_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # 2. AUTOMATED DATABASE INITIALIZER (CREATES 4 ISOLATED DBS)
  # -------------------------------------------------------------
  db-init:
    image: postgres:16-alpine
    container_name: aiia_db_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U ${POSTGRES_USER} -d postgres -c 'CREATE DATABASE identity_db;' || true;
      psql -h postgres -U ${POSTGRES_USER} -d postgres -c 'CREATE DATABASE study_governance_db;' || true;
      psql -h postgres -U ${POSTGRES_USER} -d postgres -c 'CREATE DATABASE clinical_safety_db;' || true;
      psql -h postgres -U ${POSTGRES_USER} -d postgres -c 'CREATE DATABASE audit_integrity_db;' || true;
      echo 'All 4 Databases initialized successfully!';
      exit 0;
      "

  # -------------------------------------------------------------
  # 3. KEYCLOAK 24 (IAM & RBAC - CONNECTED TO identity_db)
  # -------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: aiia_keycloak
    restart: always
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/identity_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      db-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------
  # 4. REDIS 7 (EVENT STREAMS & REAL-TIME QUEUES)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aiia_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 5. MINIO S3 OBJECT STORAGE (TRIAL FILES & CONSENT MEDIA)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: aiia_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data

  # -------------------------------------------------------------
  # 6. MINIO BUCKET INITIALIZER (AUTO-CREATES DEFAULT BUCKET)
  # -------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: aiia_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME};
      exit 0;
      "

  # -------------------------------------------------------------
  # 7. NGINX API GATEWAY (SINGLE ENTRY POINT ON PORT 80)
  # -------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: aiia_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
      - redis

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local