events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream Services
    upstream backend_api {
        server host.docker.internal:4000;
    }

    upstream keycloak_auth {
        server keycloak:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Add Global Security Headers (DPDP / Web Security)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # -----------------------------------------------------------
        # 1. AUTHENTICATION (KEYCLOAK PROXY)
        # -----------------------------------------------------------
        location /auth/ {
            proxy_pass http://keycloak_auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------
        # 2. BACKEND MICROSERVICES REST API
        # -----------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------
        # 3. REAL-TIME WEBSOCKET STREAMING (REDIS / ALERTS)
        # -----------------------------------------------------------
        location /ws {
            proxy_pass http://backend_api/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -----------------------------------------------------------
        # 4. DEFAULT HEALTH CHECK
        # -----------------------------------------------------------
        location /health {
            return 200 '{"status":"UP","gateway":"NGINX","system":"AIIA-CTMS"}\n';
            add_header Content-Type application/json;
        }
    }
}
